<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
body{margin:0;background:radial-gradient(120% 90% at 30% 0%,#241543,#0b0618 72%);font-family:"Microsoft YaHei",sans-serif;color:#fff1d6;padding:22px 26px}
h1{font-size:20px;margin:0 0 4px}.sub{color:#c9b8f0;font-size:12px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:rgba(255,246,225,.05);border:1.5px solid rgba(255,232,180,.2);border-radius:16px;padding:10px 8px;text-align:center}
.card svg{width:100%;height:360px;display:block}
.nm{font-weight:900;color:#ffd166;font-size:14px;margin-top:6px}
.ds{font-size:10.5px;color:#a99cc9;margin-top:3px;line-height:1.4}
</style></head><body>
<h1>小星 · 无脸宇航员 4 版（面罩反光，选一个）</h1>
<div class="sub">都不露五官；靠面罩反射星空/星云 + 金属高光提升质感。比例/配色可再调。</div>
<div class="grid" id="grid"></div>
<script>
const CFG=[
 {id:'V1',name:'V1 · 经典白橙',desc:'标准比例、白橙套装、金色面罩',suit1:'#ffffff',suit2:'#c9d3e0',trim:'#f76707',visor1:'#ffd166',visor2:'#7a4a00',metal:'#e9eef7',accent:'#ffd43b',chibi:false,cape:'#2b2b3a'},
 {id:'V2',name:'V2 · 深空黑金',desc:'修身黑金、金面罩，最酷',suit1:'#3a3f52',suit2:'#12141c',trim:'#ffd166',visor1:'#ffcf5c',visor2:'#5a3a00',metal:'#5a6072',accent:'#ffd43b',chibi:false,cape:'#0d0f16'},
 {id:'V3',name:'V3 · 潮玩Q版',desc:'大头盔、白青套装、薄荷面罩',suit1:'#ffffff',suit2:'#bcd7d3',trim:'#0ca678',visor1:'#63e6be',visor2:'#0b4f3f',metal:'#e6f4f1',accent:'#fff3bf',chibi:true,cape:'#2a4a44'},
 {id:'V4',name:'V4 · 粉白少女',desc:'修身粉白、紫面罩，轻盈',suit1:'#ffffff',suit2:'#ffc9d9',trim:'#e64980',visor1:'#b197fc',visor2:'#3d2a7a',metal:'#f6e9f1',accent:'#fff3bf',chibi:false,cape:'#7048e8'}
];
function char(c){
 const P = c.chibi ? {R:76,cy:118,tt:206,tb:262,legY:258,legH:56,armY:222} : {R:60,cy:104,tt:196,tb:262,legY:254,legH:66,armY:214};
 const R=P.R, cy=P.cy;
 const stars=[[-24,-18,1.8],[-8,-30,1.2],[12,-22,2.2],[28,-6,1.5],[-30,4,1.3],[6,10,1.0],[22,16,1.6],[-12,-4,1.1]].map(([dx,dy,rr])=>`<circle cx="${120+dx}" cy="${cy+dy}" r="${rr}" fill="#fff" opacity=".9"/>`).join('');
 return `<svg viewBox="0 0 240 360" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <linearGradient id="suit${c.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c.suit1}"/><stop offset="1" stop-color="${c.suit2}"/></linearGradient>
  <linearGradient id="metal${c.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="${c.metal}"/><stop offset="1" stop-color="${c.suit2}"/></linearGradient>
  <radialGradient id="visor${c.id}" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="${c.visor1}"/><stop offset="1" stop-color="${c.visor2}"/></radialGradient>
  <radialGradient id="neb${c.id}" cx="70%" cy="70%" r="70%"><stop offset="0" stop-color="#ffffff" stop-opacity=".45"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  <clipPath id="clip${c.id}"><circle cx="120" cy="${cy}" r="${R-9}"/></clipPath>
  <filter id="sh${c.id}" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".45"/></filter>
 </defs>
 <ellipse cx="120" cy="332" rx="66" ry="13" fill="#000" opacity=".4"/>
 <!-- cape -->
 <path d="M74 200 Q60 ${P.legY+16} 96 ${P.legY+24} L120 ${P.legY+6} L144 ${P.legY+24} Q180 ${P.legY+16} 166 200 Z" fill="${c.cape}" opacity=".95"/>
 <!-- legs -->
 <rect x="${104}" y="${P.legY}" width="22" height="${P.legH}" rx="10" fill="url(#suit${c.id})" stroke="#20232b" stroke-width="2"/>
 <rect x="${114}" y="${P.legY}" width="6" height="${P.legH}" rx="3" fill="${c.trim}" opacity=".8"/>
 <rect x="${126}" y="${P.legY}" width="10" height="${P.legH}" rx="5" fill="url(#suit${c.id})" stroke="#20232b" stroke-width="2" opacity="0"/>
 <rect x="${104+22}" y="${P.legY}" width="22" height="${P.legH}" rx="10" fill="url(#suit${c.id})" stroke="#20232b" stroke-width="2"/>
 <!-- boots -->
 <rect x="98" y="${P.legY+P.legH-8}" width="34" height="18" rx="8" fill="${c.trim}" stroke="#20232b" stroke-width="2"/>
 <rect x="128" y="${P.legY+P.legH-8}" width="34" height="18" rx="8" fill="${c.trim}" stroke="#20232b" stroke-width="2"/>
 <!-- torso -->
 <path d="M88 ${P.tt} Q84 ${P.tt-26} 108 ${P.tt-30} L132 ${P.tt-30} Q156 ${P.tt-26} 152 ${P.tt} L148 ${P.tb} Q120 ${P.tb+10} 92 ${P.tb} Z"
   fill="url(#suit${c.id})" stroke="#20232b" stroke-width="2.5" filter="url(#sh${c.id})"/>
 <path d="M96 ${P.tt+4} Q94 ${P.tt-14} 108 ${P.tt-18}" fill="none" stroke="#fff" stroke-width="4" opacity=".35" stroke-linecap="round"/>
 <!-- chest panel -->
 <rect x="106" y="${P.tt+8}" width="28" height="30" rx="8" fill="${c.trim}" stroke="#20232b" stroke-width="2"/>
 <circle cx="120" cy="${P.tt+23}" r="7" fill="${c.suit2}" stroke="#fff" stroke-width="1.5" opacity=".9"/>
 <path d="M120 ${P.tt+15} l2.6 6 6.6 1 -4.8 4.8 1.4 6.6 -5.8 -3.2 -5.8 3.2 1.4 -6.6 -4.8 -4.8 6.6 -1 z" fill="${c.accent}" opacity=".95"/>
 <!-- belt -->
 <rect x="92" y="${P.tb-6}" width="56" height="12" rx="6" fill="${c.trim}" stroke="#20232b" stroke-width="2"/>
 <!-- arms -->
 <ellipse cx="76" cy="${P.armY}" rx="16" ry="30" transform="rotate(14 76 ${P.armY})" fill="url(#suit${c.id})" stroke="#20232b" stroke-width="2.5"/>
 <ellipse cx="164" cy="${P.armY}" rx="16" ry="30" transform="rotate(-14 164 ${P.armY})" fill="url(#suit${c.id})" stroke="#20232b" stroke-width="2.5"/>
 <circle cx="66" cy="${P.armY+26}" r="12" fill="${c.trim}" stroke="#20232b" stroke-width="2"/>
 <circle cx="174" cy="${P.armY+26}" r="12" fill="${c.trim}" stroke="#20232b" stroke-width="2"/>
 <!-- backpack -->
 <rect x="${120-34}" y="${P.tt-6}" width="68" height="58" rx="20" fill="${c.suit2}" opacity=".55"/>
 <!-- helmet -->
 <circle cx="120" cy="${cy}" r="${R}" fill="url(#metal${c.id})" stroke="#20232b" stroke-width="3" filter="url(#sh${c.id})"/>
 <circle cx="120" cy="${cy}" r="${R-9}" fill="url(#visor${c.id})"/>
 <g clip-path="url(#clip${c.id})">
   <circle cx="${120+R*0.35}" cy="${cy-R*0.2}" r="${R*0.28}" fill="url(#neb${c.id})"/>
   <circle cx="${120+R*0.3}" cy="${cy-R*0.15}" r="${R*0.16}" fill="#ff9db4" opacity=".55"/>
   <ellipse cx="${120+R*0.3}" cy="${cy-R*0.15}" rx="${R*0.28}" ry="${R*0.07}" fill="none" stroke="#ffe066" stroke-width="2" opacity=".7" transform="rotate(-18 ${120+R*0.3} ${cy-R*0.15})"/>
   ${stars}
   <path d="M${120-R*0.7} ${cy+R*0.5} Q${120-R*0.1} ${cy-R*0.2} ${120+R*0.75} ${cy-R*0.55} L${120+R*0.75} ${cy-R*0.35} Q${120} ${cy-R*0.05} ${120-R*0.7} ${cy+R*0.65} Z" fill="#fff" opacity=".18"/>
 </g>
 <path d="M${120-R+8} ${cy-R*0.5} A${R-6} ${R-6} 0 0 1 ${120+R*0.55} ${cy-R+4}" fill="none" stroke="#fff" stroke-width="4" opacity=".55" stroke-linecap="round"/>
 </svg>`;
}
const grid=document.getElementById('grid');
CFG.forEach(c=>{const el=document.createElement('div');el.className='card';el.innerHTML=`${char(c)}<div class="nm">${c.name}</div><div class="ds">${c.desc}</div>`;grid.appendChild(el)});
</script>
</body></html>
