<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>手绘词图样例</title>
<style>
  body{margin:0;background:#f4f6fb;font-family:"Microsoft YaHei",sans-serif;color:#2a2f3a;}
  .wrap{width:1500px;padding:34px 40px;}
  h1{font-size:22px;margin:0 0 4px;}
  .sub{color:#7a8296;font-size:13px;margin-bottom:22px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;}
  .card{background:#fff;border-radius:20px;padding:14px 10px 10px;box-shadow:0 8px 22px rgba(40,60,110,.08);display:flex;flex-direction:column;align-items:center;}
  svg{width:186px;height:186px;}
  .en{font-size:19px;font-weight:800;margin-top:8px;}
  .cn{font-size:12px;color:#8a91a6;}
</style></head>
<body><div class="wrap">
  <h1>看图猜词 · 手绘样例（8 个）</h1>
  <div class="sub">纯 SVG 手绘，扁平风格，统一光照/描边/投影；正式可批量画同一套。</div>
  <div class="grid">

  <div class="card">
    <svg viewBox="0 0 200 200">
      <ellipse cx="100" cy="180" rx="52" ry="9" fill="#000" opacity=".08"/>
      <path d="M100 66 q4 -24 26 -32" stroke="#7a4a2a" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M104 66 q24 -22 44 -2 q-32 16 -44 2z" fill="#59c26a"/>
      <circle cx="100" cy="122" r="60" fill="#ef5350"/>
      <circle cx="80" cy="104" r="18" fill="#fff" opacity=".35"/>
    </svg>
    <div class="en">apple</div><div class="cn">苹果</div>
  </div>

  <div class="card">
    <svg viewBox="0 0 200 200">
      <ellipse cx="105" cy="176" rx="58" ry="9" fill="#000" opacity=".08"/>
      <path d="M46 52 C60 150 150 178 176 150 C154 150 122 140 98 108 C82 86 78 64 66 54 C60 50 50 46 46 52 Z" fill="#ffd54a" stroke="#e5a800" stroke-width="5" stroke-linejoin="round"/>
      <path d="M62 62 C76 140 150 168 168 150" stroke="#fff3b0" stroke-width="7" fill="none" opacity=".75"/>
    </svg>
    <div class="en">banana</div><div class="cn">香蕉</div>
  </div>

  <div class="card">
    <svg viewBox="0 0 200 200">
      <ellipse cx="100" cy="182" rx="50" ry="8" fill="#000" opacity=".08"/>
      <path d="M54 74 L48 28 L90 54 Z" fill="#f6b83d"/>
      <path d="M146 74 L152 28 L110 54 Z" fill="#f6b83d"/>
      <circle cx="100" cy="116" r="62" fill="#f6b83d"/>
      <ellipse cx="80" cy="108" rx="8" ry="11" fill="#3a2f22"/>
      <ellipse cx="120" cy="108" rx="8" ry="11" fill="#3a2f22"/>
      <path d="M96 130 L104 130 L100 138 Z" fill="#e86a8a"/>
      <path d="M100 138 q-10 12 -22 6 M100 138 q10 12 22 6" stroke="#3a2f22" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M40 120 l26 6 M40 140 l26 -6 M160 120 l-26 6 M160 140 l-26 -6" stroke="#3a2f22" stroke-width="3.5" stroke-linecap="round"/>
    </svg>
    <div class="en">cat</div><div class="cn">猫</div>
  </div>

  <div class="card">
    <svg viewBox="0 0 200 200">
      <ellipse cx="100" cy="182" rx="50" ry="8" fill="#000" opacity=".08"/>
      <ellipse cx="52" cy="96" rx="26" ry="46" fill="#a9713f" transform="rotate(16 52 96)"/>
      <ellipse cx="148" cy="96" rx="26" ry="46" fill="#a9713f" transform="rotate(-16 148 96)"/>
      <circle cx="100" cy="110" r="60" fill="#c98d57"/>
      <circle cx="100" cy="128" r="30" fill="#e7cfae"/>
      <ellipse cx="80" cy="100" rx="7" ry="10" fill="#3a2f22"/>
      <ellipse cx="120" cy="100" rx="7" ry="10" fill="#3a2f22"/>
      <ellipse cx="100" cy="120" rx="13" ry="10" fill="#3a2f22"/>
      <path d="M100 130 v10 M92 142 q8 8 16 0" stroke="#3a2f22" stroke-width="4" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="en">dog</div><div class="cn">狗</div>
  </div>

  <div class="card">
    <svg viewBox="0 0 200 200">
      <ellipse cx="100" cy="176" rx="58" ry="9" fill="#000" opacity=".08"/>
      <rect x="40" y="120" width="120" height="40" rx="10" fill="#4f8cff"/>
      <rect x="40" y="86" width="120" height="40" rx="10" fill="#59c26a"/>
      <rect x="52" y="128" width="80" height="5" rx="2" fill="#fff" opacity=".7"/>
      <rect x="52" y="94" width="80" height="5" rx="2" fill="#fff" opacity=".7"/>
      <path d="M100 86 v40" stroke="#2b5bb3" stroke-width="4" opacity=".5"/>
    </svg>
    <div class="en">book</div><div class="cn">书</div>
  </div>

  <div class="card">
    <svg viewBox="0 0 200 200">
      <ellipse cx="100" cy="180" rx="58" ry="8" fill="#000" opacity=".08"/>
      <g transform="rotate(-38 100 100)">
        <rect x="70" y="34" width="52" height="118" rx="8" fill="#ffd54a"/>
        <rect x="70" y="34" width="52" height="20" rx="8" fill="#f7a8c4"/>
        <path d="M70 152 L122 152 L96 188 Z" fill="#f2d2a9"/>
        <path d="M88 168 L104 168 L96 188 Z" fill="#3a2f22"/>
        <rect x="70" y="60" width="52" height="6" fill="#e5a800" opacity=".6"/>
      </g>
    </svg>
    <div class="en">pencil</div><div class="cn">铅笔</div>
  </div>

  <div class="card">
    <svg viewBox="0 0 200 200">
      <ellipse cx="100" cy="180" rx="50" ry="8" fill="#000" opacity=".08"/>
      <circle cx="100" cy="104" r="66" fill="#ef5350"/>
      <path d="M100 38 A66 66 0 0 1 100 170 A33 66 0 0 0 100 38 Z" fill="#fff" opacity=".9"/>
      <path d="M100 38 A66 66 0 0 1 100 170" fill="none" stroke="#c0392b" stroke-width="4" opacity=".4"/>
      <circle cx="100" cy="104" r="66" fill="none" stroke="#c0392b" stroke-width="4" opacity=".35"/>
    </svg>
    <div class="en">ball</div><div class="cn">球</div>
  </div>

  <div class="card">
    <svg viewBox="0 0 200 200">
      <ellipse cx="100" cy="180" rx="46" ry="8" fill="#000" opacity=".08"/>
      <path d="M64 40 h72 l-8 30 v96 h-56 v-96 z" fill="#eaf3ff" stroke="#b9cbe6" stroke-width="3"/>
      <path d="M64 40 l8 30 h56 l8 -30 z" fill="#4f8cff"/>
      <rect x="84" y="18" width="32" height="18" rx="5" fill="#4f8cff"/>
      <rect x="78" y="96" width="44" height="34" rx="6" fill="#cfe0ff"/>
      <text x="100" y="120" font-size="18" font-weight="700" fill="#4f8cff" text-anchor="middle">MILK</text>
    </svg>
    <div class="en">milk</div><div class="cn">牛奶</div>
  </div>

  </div>
</div></body></html>
