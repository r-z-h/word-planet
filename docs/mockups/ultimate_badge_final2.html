<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
body{margin:0;background:radial-gradient(120% 90% at 50% 0%,#241245,#0d0619 72%);font-family:"Microsoft YaHei",sans-serif;color:#fff1d6;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:4px}
.big{width:340px;height:340px;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(255,214,120,.20),rgba(120,80,200,.07) 55%,transparent 72%);border-radius:50%}
.big svg{width:300px;height:300px;filter:drop-shadow(0 14px 34px rgba(0,0,0,.6))}
.cap{font-size:19px;font-weight:900;color:#ffd166;margin-top:4px}
.sub{font-size:12px;color:#c9b8f0}
.sizes{display:flex;align-items:flex-end;gap:22px;margin-top:14px}
.sizes .ic{display:flex;flex-direction:column;align-items:center;gap:4px;color:#9f8fc7;font-size:10px}
</style></head><body>
<div class="big">
<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <radialGradient id="pp" cx="36%" cy="30%" r="82%"><stop offset="0" stop-color="#ffe3f0"/><stop offset=".45" stop-color="#ff8fb1"/><stop offset="1" stop-color="#c2255c"/></radialGradient>
  <linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3bf"/><stop offset="1" stop-color="#f59f00"/></linearGradient>
  <filter id="glo" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <g id="flw"><circle cx="0" cy="-4.4" r="3.4"/><circle cx="4.2" cy="-1.3" r="3.4"/><circle cx="2.6" cy="3.5" r="3.4"/><circle cx="-2.6" cy="3.5" r="3.4"/><circle cx="-4.2" cy="-1.3" r="3.4"/><circle r="2.4" fill="#ffd43b" stroke="none"/></g>
 </defs>

 <!-- 内层星环（后） -->
 <ellipse cx="120" cy="132" rx="78" ry="20" transform="rotate(26 120 132)" fill="none" stroke="#ffd166" stroke-width="3" opacity=".6"/>

 <!-- 外层星环：后半圈（在星球后） -->
 <g transform="rotate(-18 120 132)">
   <path d="M24 132 A96 28 0 0 1 216 132" fill="none" stroke="#ffd166" stroke-width="6" opacity=".92"/>
   <path d="M24 132 A96 28 0 0 1 216 132" fill="none" stroke="#fff3bf" stroke-width="2" opacity=".8"/>
   <g fill="#ff9db4" stroke="#e64980" stroke-width="1">
     <g transform="translate(52.1,112.2)"><use href="#flw"/></g>
     <g transform="translate(187.9,112.2)"><use href="#flw"/></g>
   </g>
 </g>

 <!-- 星球（粉色） -->
 <circle cx="120" cy="132" r="58" fill="url(#pp)" stroke="#4a0f2a" stroke-width="3" filter="url(#glo)"/>
 <ellipse cx="102" cy="112" rx="18" ry="12" fill="#ffffff" opacity=".5"/>
 <circle cx="150" cy="158" r="20" fill="#ffffff" opacity=".08"/>

 <!-- 外层星环：前半圈（盖在星球上） -->
 <g transform="rotate(-18 120 132)">
   <path d="M24 132 A96 28 0 0 0 216 132" fill="none" stroke="#ffd166" stroke-width="6" opacity=".95"/>
   <path d="M24 132 A96 28 0 0 0 216 132" fill="none" stroke="#fff3bf" stroke-width="2" opacity=".9"/>
   <g fill="#ff9db4" stroke="#e64980" stroke-width="1">
     <g transform="translate(24,132)"><use href="#flw"/></g>
     <g transform="translate(52.1,151.8)"><use href="#flw"/></g>
     <g transform="translate(187.9,151.8)"><use href="#flw"/></g>
     <g transform="translate(216,132)"><use href="#flw"/></g>
   </g>
 </g>

 <!-- 皇冠 -->
 <path d="M94 78 L100 50 L113 65 L120 45 L127 65 L140 50 L146 78 Z" fill="url(#gd)" stroke="#b8860b" stroke-width="2.5" stroke-linejoin="round"/>
 <rect x="92" y="78" width="56" height="9" rx="4" fill="#f59f00" stroke="#b8860b" stroke-width="2"/>
 <circle cx="100" cy="50" r="3.4" fill="#ff6b6b"/><circle cx="120" cy="45" r="3.4" fill="#74c0fc"/><circle cx="140" cy="50" r="3.4" fill="#63e6be"/>
 <circle cx="108" cy="82" r="2.4" fill="#ff8787"/><circle cx="120" cy="82" r="2.4" fill="#ffd43b"/><circle cx="132" cy="82" r="2.4" fill="#74c0fc"/>

 <!-- 星点 -->
 <path d="M198 66 l2 7 7 2 -7 2 -2 7 -2 -7 -7 -2 7 -2z" fill="#fff3bf"/>
 <path d="M40 78 l1.6 5 5 1.6 -5 1.6 -1.6 5 -1.6 -5 -5 -1.6 5 -1.6z" fill="#fff3bf"/>
 <circle cx="200" cy="110" r="1.8" fill="#fff"/><circle cx="44" cy="102" r="1.8" fill="#fff"/><circle cx="176" cy="196" r="1.6" fill="#fff"/><circle cx="64" cy="196" r="1.6" fill="#fff"/>
</svg>
</div>
<div class="cap">寰宇圆满·万物生花 · 最高成就徽章（粉色·正确遮挡）</div>
<div class="sub">粉星球 + 双层金环（前半圈压在星球上，后半圈被挡住）+ 皇冠 + 花</div>
<div class="sizes">
 <div class="ic"><svg width="72" height="72" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg"><circle cx="120" cy="132" r="58" fill="#ff8fb1"/><ellipse cx="120" cy="132" rx="96" ry="28" transform="rotate(-18 120 132)" fill="none" stroke="#ffd166" stroke-width="6"/><path d="M94 78 L100 50 L113 65 L120 45 L127 65 L140 50 L146 78 Z" fill="#ffd43b"/></svg><span>~48px</span></div>
 <div class="ic"><svg width="40" height="40" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg"><circle cx="120" cy="132" r="58" fill="#ff8fb1"/><ellipse cx="120" cy="132" rx="96" ry="28" transform="rotate(-18 120 132)" fill="none" stroke="#ffd166" stroke-width="8"/><path d="M94 78 L100 50 L113 65 L120 45 L127 65 L140 50 L146 78 Z" fill="#ffd43b"/></svg><span>~28px</span></div>
</div>
</body></html>
