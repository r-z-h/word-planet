<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
body{margin:0;background:radial-gradient(120% 90% at 30% 0%,#241543,#0b0618 72%);font-family:"Microsoft YaHei",sans-serif;color:#fff1d6;padding:22px 26px}
h1{font-size:20px;margin:0 0 4px}.sub{color:#c9b8f0;font-size:12px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.card{background:rgba(255,246,225,.05);border:1.5px solid rgba(255,232,180,.2);border-radius:16px;padding:10px 8px;text-align:center}
.card svg{width:100%;height:300px;display:block}
.nm{font-weight:900;color:#ffd166;font-size:14px;margin-top:6px}
.ds{font-size:10.5px;color:#a99cc9;margin-top:3px;line-height:1.4}
</style></head><body>
<h1>小星 · 角色风格版本（选一个拍板）</h1>
<div class="sub">同一个角色、5 种画风；都保留"橙色系/星形能量灯/披风"的识别点，配色可再改</div>
<div class="grid" id="grid"></div>
<script>
const CFG = [
 {id:'A',name:'A · Q版圆润', desc:'大头萌系、橙服、软阴影（在它基础上细化）', style:'soft', suit1:'#ffb066', suit2:'#f76707', accent:'#ffd166', cape:'#d63031', skin:'#ffd9b3', hair:'#4b3470', head:1.0},
 {id:'B',name:'B · 扁平插画', desc:'粗描边、扁平色块、潮玩海报感', style:'flat', suit1:'#4dabf7', suit2:'#1c7ed6', accent:'#ffd43b', cape:'#f06595', skin:'#ffd9b3', hair:'#2b1b12', head:0.95},
 {id:'C',name:'C · 3D质感', desc:'渐变高光、软陶质感、偏皮克斯', style:'3d', suit1:'#63e6be', suit2:'#0ca678', accent:'#fff3bf', cape:'#ff922b', skin:'#ffd9b3', hair:'#3b2a55', head:0.88},
 {id:'D',name:'D · 太空冒险家', desc:'护目镜+短披风+工具包，酷一点', style:'goggles', suit1:'#ff8787', suit2:'#c92a2a', accent:'#ffd43b', cape:'#212529', skin:'#ffd9b3', hair:'#2b1b12', head:0.92},
 {id:'E',name:'E · 女孩版', desc:'马尾+粉色套装+雀斑，活泼可爱', style:'girl', suit1:'#ff9db4', suit2:'#e64980', accent:'#fff3bf', cape:'#7048e8', skin:'#ffd9b3', hair:'#5f3dc4', head:0.98}
];

function char(c){
  const grad = c.style==='flat' ? '' : `
    <defs>
      <linearGradient id="suit${c.id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${c.suit1}"/><stop offset="1" stop-color="${c.suit2}"/>
      </linearGradient>
      <radialGradient id="face${c.id}" cx="38%" cy="32%" r="75%">
        <stop offset="0" stop-color="#fff1e2"/><stop offset="1" stop-color="${c.skin}"/>
      </radialGradient>
    </defs>`;
  const suitFill = c.style==='flat' ? c.suit2 : `url(#suit${c.id})`;
  const faceFill = c.style==='flat' ? c.skin : `url(#face${c.id})`;
  const outline = c.style==='flat' ? '#2b1b12' : '#20304a';
  const ow = c.style==='flat' ? 5 : 2.5;
  const headY = 96;
  const r = 58 * c.head;
  return `<svg viewBox="0 0 240 320" xmlns="http://www.w3.org/2000/svg">
  ${grad}
  <ellipse cx="120" cy="304" rx="62" ry="12" fill="#000" opacity=".35"/>
  <!-- cape -->
  <path d="M66 190 Q54 258 92 272 L120 252 L148 272 Q186 258 174 190 Z" fill="${c.cape}" stroke="${outline}" stroke-width="${ow}" opacity=".95"/>
  <!-- legs -->
  <rect x="96" y="238" width="20" height="52" rx="9" fill="${c.suit2}" stroke="${outline}" stroke-width="${ow}"/>
  <rect x="124" y="238" width="20" height="52" rx="9" fill="${c.suit2}" stroke="${outline}" stroke-width="${ow}"/>
  <rect x="92" y="284" width="28" height="14" rx="6" fill="${c.accent}" stroke="${outline}" stroke-width="${ow}"/>
  <rect x="120" y="284" width="28" height="14" rx="6" fill="${c.accent}" stroke="${outline}" stroke-width="${ow}"/>
  <!-- body -->
  <rect x="80" y="176" width="80" height="78" rx="26" fill="${suitFill}" stroke="${outline}" stroke-width="${ow}"/>
  ${c.style==='flat' ? '' : `<ellipse cx="100" cy="200" rx="10" ry="16" fill="#fff" opacity=".22"/>`}
  <rect x="108" y="196" width="24" height="26" rx="6" fill="${c.accent}" stroke="${outline}" stroke-width="${ow}" opacity=".9"/>
  <circle cx="120" cy="209" r="6" fill="${c.suit2}"/>
  <rect x="86" y="238" width="68" height="10" rx="5" fill="${c.suit2}" stroke="${outline}" stroke-width="${ow}"/>
  <!-- arms -->
  <ellipse cx="70" cy="206" rx="18" ry="30" transform="rotate(18 70 206)" fill="${suitFill}" stroke="${outline}" stroke-width="${ow}"/>
  <ellipse cx="170" cy="206" rx="18" ry="30" transform="rotate(-18 170 206)" fill="${suitFill}" stroke="${outline}" stroke-width="${ow}"/>
  <circle cx="60" cy="232" r="12" fill="${c.accent}" stroke="${outline}" stroke-width="${ow}"/>
  <circle cx="180" cy="232" r="12" fill="${c.accent}" stroke="${outline}" stroke-width="${ow}"/>
  <!-- backpack star -->
  <circle cx="120" cy="170" r="13" fill="${c.accent}" stroke="${outline}" stroke-width="${ow}"/>
  <path d="M120 160 l3 7 8 1 -6 6 2 8 -7 -4 -7 4 2 -8 -6 -6 8 -1 z" fill="#fff8dc"/>
  <!-- head -->
  <circle cx="120" cy="${headY}" r="${r}" fill="${faceFill}" stroke="${outline}" stroke-width="${ow}"/>
  ${c.style==='girl'?`<path d="M62 ${headY+18} Q56 ${headY+80} 84 ${headY+96} L78 ${headY+40} Z" fill="${c.hair}" stroke="${outline}" stroke-width="${ow}"/>`:''}
  <path d="M${120-r} ${headY-8} Q120 ${headY-r-18} ${120+r} ${headY-8} Q120 ${headY-24} ${120-r} ${headY-8} Z" fill="${c.hair}" stroke="${outline}" stroke-width="${ow}"/>
  <!-- eyes -->
  <ellipse cx="98" cy="${headY+4}" rx="8" ry="9" fill="#2b1b12"/><circle cx="100" cy="${headY+1}" r="2.6" fill="#fff"/>
  <ellipse cx="142" cy="${headY+4}" rx="8" ry="9" fill="#2b1b12"/><circle cx="144" cy="${headY+1}" r="2.6" fill="#fff"/>
  <path d="M108 ${headY+22} q12 10 24 0" fill="none" stroke="#2b1b12" stroke-width="3" stroke-linecap="round"/>
  <circle cx="82" cy="${headY+18}" r="5" fill="#ff9db4" opacity=".75"/><circle cx="158" cy="${headY+18}" r="5" fill="#ff9db4" opacity=".75"/>
  ${c.style==='girl'?`<circle cx="92" cy="${headY+12}" r="1.6" fill="#c98a5b"/><circle cx="102" cy="${headY+16}" r="1.6" fill="#c98a5b"/><circle cx="148" cy="${headY+12}" r="1.6" fill="#c98a5b"/>`:''}
  <!-- helmet / goggles -->
  ${c.style==='goggles'
    ? `<rect x="${120-r-4}" y="${headY-10}" width="${2*r+8}" height="18" rx="9" fill="#212529" opacity=".92"/>
       <circle cx="100" cy="${headY+4}" r="17" fill="#74c0fc" opacity=".45" stroke="#212529" stroke-width="4"/>
       <circle cx="140" cy="${headY+4}" r="17" fill="#74c0fc" opacity=".45" stroke="#212529" stroke-width="4"/>
       <line x1="117" y1="${headY+4}" x2="123" y2="${headY+4}" stroke="#212529" stroke-width="4"/>`
    : `<circle cx="120" cy="${headY}" r="${r+7}" fill="none" stroke="#bfe0ff" stroke-width="${ow}" opacity=".85"/>
       <path d="M${120-r+8} ${headY-24} q${r-12} -18 ${r+14} 2" fill="none" stroke="#ffffff" stroke-width="5" opacity=".5" stroke-linecap="round"/>`}
  </svg>`;
}
const grid=document.getElementById('grid');
CFG.forEach(c=>{
  const el=document.createElement('div'); el.className='card';
  el.innerHTML=`${char(c)}<div class="nm">${c.name}</div><div class="ds">${c.desc}</div>`;
  grid.appendChild(el);
});
</script>
</body></html>
