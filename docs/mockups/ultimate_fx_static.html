<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0618}
.wpu{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,#2a1a4d 0%,#0b0618 70%);overflow:hidden;font-family:"Microsoft YaHei",sans-serif;color:#fff1d6}
.wpu-canvas{position:absolute;inset:0;width:100%;height:100%}
.wpu-stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.wpu-badge{width:190px;height:190px;filter:drop-shadow(0 0 30px rgba(255,214,120,.85))}
.wpu-rings{position:absolute;width:190px;height:190px;top:calc(50% - 95px - 82px);pointer-events:none}
.wpu-rings span{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,214,120,.8);opacity:.5}
.wpu-rings span:nth-child(2){transform:scale(1.6);opacity:.32}
.wpu-rings span:nth-child(3){transform:scale(2.3);opacity:.16}
.wpu-title .l1,.wpu-title .l2{font-size:44px;font-weight:900;letter-spacing:.14em;color:#ffd166;text-shadow:0 0 18px rgba(255,214,120,.85),0 4px 10px rgba(0,0,0,.6)}
.wpu-title .l2{font-size:48px}
.wpu-title .sub{margin-top:10px;font-size:15px;letter-spacing:.6em;color:#ffe8b0}
.wpu-close{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);font-size:12px;color:#c9b8f0;background:rgba(255,246,225,.1);border:1.5px solid rgba(255,232,180,.35);border-radius:99px;padding:7px 18px}
</style></head><body>
<div class="wpu">
 <canvas class="wpu-canvas"></canvas>
 <div class="wpu-stage">
   <div class="wpu-rings"><span></span><span></span><span></span></div>
   <img class="wpu-badge" src="../../frontend/public/badges/ultimate.svg">
   <div class="wpu-title"><div class="l1">寰宇圆满</div><div class="l2">万物生花</div><div class="sub">全 宇 通 关</div></div>
 </div>
 <button class="wpu-close">点击任意处关闭</button>
</div>
<script>
const canvas=document.querySelector('.wpu-canvas'),ctx=canvas.getContext('2d');const W=innerWidth,H=innerHeight,dpr=2;
canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
const colors=['#ffd166','#ff8fb1','#74c0fc','#63e6be','#b197fc','#fff3bf'];const rand=(a,b)=>a+Math.random()*(b-a);
const parts=[];
function burst(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=rand(2.8,7);parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,color:colors[(Math.random()*colors.length)|0],size:rand(1.8,3.8),life:rand(40,80),age:rand(0,20),kind:Math.random()<.35?'rect':'dot',rot:rand(0,6.28)})}}
burst(W*.24,H*.26,90);burst(W*.76,H*.22,90);burst(W*.5,H*.16,70);burst(W*.62,H*.5,60);burst(W*.34,H*.5,60);
for(let i=0;i<160;i++){parts.push({x:rand(0,W),y:rand(0,H*.8),vx:rand(-.2,.2),vy:rand(.3,1.2),color:colors[(Math.random()*colors.length)|0],size:rand(3,6),life:200,age:rand(0,120),kind:'rect',rot:rand(0,6.28)})}
for(const p of parts){p.x+=p.vx*10;p.y+=p.vy*10;const a=Math.max(.15,1-p.age/p.life);ctx.globalAlpha=a;ctx.fillStyle=p.color;if(p.kind==='rect'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);ctx.restore()}else{ctx.beginPath();ctx.arc(p.x,p.y,p.size/2,0,6.28);ctx.fill()}}
ctx.globalAlpha=1;
</script>
</body></html>
