<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>星球地图 · 排版预览（独立预览，不影响系统）</title>
<style>
  html,body{margin:0;background:#0a0719;font-family:"Microsoft YaHei",sans-serif;}
  .frame{width:1500px;height:950px;padding:24px;box-sizing:border-box;}
  .map{
    position:relative;width:100%;height:100%;border-radius:22px;overflow:hidden;
    background:
      radial-gradient(42% 32% at 22% 16%, rgba(96,128,255,.18), transparent 70%),
      radial-gradient(40% 30% at 78% 28%, rgba(176,96,255,.15), transparent 70%),
      radial-gradient(45% 34% at 30% 82%, rgba(64,208,200,.11), transparent 72%),
      radial-gradient(38% 28% at 72% 88%, rgba(255,150,90,.09), transparent 72%),
      linear-gradient(160deg,#0b0820 0%,#14102e 58%,#0a0719 100%);
    color:#eef;
    --ink:#0f0822; --gold:#ffd76e; --dim:#9b93c0;
    --l1:#4bd6a8; --l1b:#a9f5d8; --l2:#5b8cff; --l2b:#a9c4ff; --l3:#b48bff; --l3b:#dcc8ff;
  }
  .stars{position:absolute;inset:0;}
  .routes{position:absolute;inset:0;width:100%;height:100%;}
  .routes path{fill:none;stroke-linecap:round;stroke-dasharray:4 7;opacity:.55;}
  .zone{position:absolute;left:2%;right:2%;transform:translateY(-50%);display:flex;align-items:center;gap:8px;font-weight:800;color:var(--dim);pointer-events:none;}
  .zone .nm{font-size:13px;letter-spacing:.05em;}
  .zone .tp{font-size:10px;opacity:.85;}
  .zone::after{content:'';flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,226,168,.16),transparent);}
  .z-l1{color:var(--l1b);} .z-l2{color:var(--l2b);} .z-l3{color:rgba(192,168,255,.72);}

  .planet{position:absolute;width:132px;margin-left:-66px;transform:translateY(-32px);display:flex;flex-direction:column;align-items:center;gap:3px;}
  .disc{width:64px;height:64px;border-radius:50%;position:relative;display:grid;place-items:center;box-shadow:0 4px 0 rgba(15,8,34,.55),0 0 18px rgba(120,150,255,.2);}
  .disc::before{content:'';position:absolute;inset:5px;border-radius:50%;background:rgba(21,13,48,.94);}
  .ball{position:relative;width:48px;height:48px;border-radius:50%;border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink),inset -4px -5px 0 rgba(0,0,0,.16);overflow:hidden;}
  .face{position:absolute;left:50%;top:50%;width:80px;height:80px;transform:translate(-50%,-50%) scale(.6);transform-origin:center;}
  .face i{position:absolute;background:var(--ink);}
  .e1{left:20px;} .e2{right:20px;}
  .face b{position:absolute;left:50%;transform:translateX(-50%);border:3px solid var(--ink);}
  .f-excited i{top:25px;width:9px;height:12px;border-radius:50%;}
  .f-excited b{top:40px;width:21px;height:14px;border:0;background:var(--ink);border-radius:4px 4px 13px 13px;}
  .f-proud i{top:29px;width:11px;height:4px;border-radius:4px;}
  .f-proud b{top:39px;width:19px;height:10px;border-radius:0 0 13px 13px;}
  .f-focus i{top:27px;width:8px;height:9px;border-radius:3px;}
  .f-focus b{top:45px;width:13px;height:0;border-width:3px 0 0;border-radius:0;}
  .f-curious .e1{top:25px;width:11px;height:13px;border-radius:50%;}
  .f-curious .e2{top:28px;width:7px;height:8px;border-radius:50%;}
  .f-curious b{top:42px;width:9px;height:9px;border-radius:50%;border-top:3px solid var(--ink);}
  .f-sleepy i{top:30px;width:10px;height:3px;border-radius:3px;}
  .f-sleepy b{top:42px;width:9px;height:5px;border-radius:0 0 7px 7px;}
  .nm{font-size:11.5px;font-weight:900;text-shadow:0 2px 0 rgba(20,10,40,.95);white-space:nowrap;}
  .st{font-size:9.5px;color:var(--dim);font-weight:700;white-space:nowrap;}
  .medal{display:inline-flex;align-items:center;gap:3px;padding:1px 7px 1px 4px;border-radius:999px;background:rgba(20,10,40,.6);border:1.5px solid rgba(255,205,76,.44);font-size:9.5px;font-weight:900;color:var(--gold);}
  .puretag{padding:1px 7px;border-radius:999px;border:1.5px dashed rgba(255,232,180,.34);font-size:9px;font-weight:800;color:var(--dim);}
  .l1{--c:var(--l1);--c2:var(--l1b);} .l2{--c:var(--l2);--c2:var(--l2b);} .l3{--c:var(--l3);--c2:var(--l3b);}
  .ball{background:radial-gradient(circle at 33% 27%,var(--c2),var(--c) 72%);}
  .disc{background:conic-gradient(var(--c) var(--p,0%),rgba(255,255,255,.08) 0);}
  .current .disc{box-shadow:0 4px 0 rgba(15,8,34,.55),0 0 0 5px rgba(255,226,168,.15),0 0 22px rgba(255,200,120,.55);}
  .locked .ball{filter:grayscale(1) brightness(.7);}

  .gate{position:absolute;left:47%;top:30%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;}
  .gate .ring{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:2px dashed rgba(255,205,76,.6);background:rgba(255,205,76,.12);font-size:14px;}
  .gate .lbl{font-size:9px;font-weight:900;color:var(--gold);}

  .feat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;}
  .fstar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:radial-gradient(circle at 35% 30%,#5a4bd6,#2a1f5e);border:2px dashed rgba(255,226,168,.5);box-shadow:0 0 18px rgba(120,90,255,.45);}
  .fnm{font-size:10.5px;font-weight:800;} .fsoon{font-size:8.5px;color:var(--dim);}
</style>
</head>
<body>
<div class="frame">
  <div class="map">
    <!-- 星点 -->
    <svg class="stars" viewBox="0 0 1500 950" preserveAspectRatio="none">
      <g fill="#ffffff">
        <!-- 手动散布的星点 -->
        <circle cx="120" cy="90" r="1.6" opacity=".8"/><circle cx="300" cy="40" r="1.2" opacity=".6"/>
        <circle cx="520" cy="130" r="1.8" opacity=".7"/><circle cx="760" cy="70" r="1.3" opacity=".6"/>
        <circle cx="980" cy="150" r="1.5" opacity=".7"/><circle cx="1240" cy="90" r="1.2" opacity=".6"/>
        <circle cx="1420" cy="180" r="1.7" opacity=".7"/><circle cx="180" cy="300" r="1.3" opacity=".55"/>
        <circle cx="420" cy="380" r="1.6" opacity=".6"/><circle cx="700" cy="320" r="1.1" opacity=".5"/>
        <circle cx="1120" cy="300" r="1.5" opacity=".65"/><circle cx="1380" cy="360" r="1.3" opacity=".6"/>
        <circle cx="90" cy="520" r="1.4" opacity=".6"/><circle cx="360" cy="560" r="1.8" opacity=".7"/>
        <circle cx="640" cy="500" r="1.2" opacity=".55"/><circle cx="900" cy="560" r="1.6" opacity=".65"/>
        <circle cx="1200" cy="520" r="1.3" opacity=".6"/><circle cx="1460" cy="600" r="1.5" opacity=".65"/>
        <circle cx="160" cy="760" r="1.6" opacity=".7"/><circle cx="430" cy="820" r="1.2" opacity=".55"/>
        <circle cx="720" cy="780" r="1.5" opacity=".65"/><circle cx="1010" cy="840" r="1.3" opacity=".6"/>
        <circle cx="1280" cy="780" r="1.7" opacity=".7"/><circle cx="1440" cy="860" r="1.2" opacity=".55"/>
        <circle cx="250" cy="200" r="1.1" opacity=".5"/><circle cx="860" cy="240" r="1.4" opacity=".6"/>
        <circle cx="1100" cy="660" r="1.5" opacity=".6"/><circle cx="560" cy="680" r="1.2" opacity=".55"/>
      </g>
    </svg>

    <!-- 星座连线（按等级） -->
    <svg class="routes" viewBox="0 0 1500 950" preserveAspectRatio="none">
      <path d="M300,114 L960,190" stroke="rgba(192,168,255,.38)" stroke-width="2" stroke-dasharray="7 11"/>
      <path d="M360,380 L930,475" stroke="rgba(150,180,255,.4)" stroke-width="2" stroke-dasharray="7 11"/>
      <path d="M330,627 L840,722 L510,855" stroke="rgba(111,214,190,.38)" stroke-width="2" stroke-dasharray="7 11"/>
    </svg>

    <div class="zone z-l3" style="top:4%"><span class="nm">挑战星海</span><span class="tp">L3 · 初中 · 已解锁</span></div>
    <div class="zone z-l2" style="top:34%"><span class="nm">探索星带</span><span class="tp">L2 · 小学高年级 · 已解锁</span></div>
    <div class="zone z-l1" style="top:66%"><span class="nm">启程星云</span><span class="tp">L1 · 小学低年级</span></div>

    <!-- 星球 -->
    <div class="planet l3" style="left:20%;top:12%"><span class="disc" style="--p:13%"><span class="ball"><span class="face f-focus"><i class="e1"></i><i class="e2"></i><b></b></span></span></span><span class="nm">听力理解</span><span class="st">2 / 15 套</span><span class="medal">🎧 1</span></div>
    <div class="planet l3" style="left:64%;top:20%"><span class="disc" style="--p:0%"><span class="ball"><span class="face f-sleepy"><i class="e1"></i><i class="e2"></i><b></b></span></span></span><span class="nm">拼写进阶</span><span class="st">0 / 95 套</span><span class="medal">🔮 0</span></div>
    <div class="planet l2 current" style="left:24%;top:40%"><span class="disc" style="--p:14%"><span class="ball"><span class="face f-excited"><i class="e1"></i><i class="e2"></i><b></b></span></span></span><span class="nm">单词跟读</span><span class="st">4 / 29 套 · 当前</span><span class="medal">🐦 0</span></div>
    <div class="planet l2" style="left:62%;top:50%"><span class="disc" style="--p:3%"><span class="ball"><span class="face f-sleepy"><i class="e1"></i><i class="e2"></i><b></b></span></span></span><span class="nm">简单拼写</span><span class="st">1 / 27 套</span><span class="medal">✍️ 0</span></div>
    <div class="planet l1" style="left:22%;top:66%"><span class="disc" style="--p:6%"><span class="ball"><span class="face f-sleepy"><i class="e1"></i><i class="e2"></i><b></b></span></span></span><span class="nm">常用单词</span><span class="st">2 / 32 套</span><span class="medal">🐻 0</span></div>
    <div class="planet l1" style="left:56%;top:76%"><span class="disc" style="--p:27%"><span class="ball"><span class="face f-curious"><i class="e1"></i><i class="e2"></i><b></b></span></span></span><span class="nm">基础问候词</span><span class="st">6 / 22 套</span><span class="medal">🥚 0</span></div>
    <div class="planet l1" style="left:34%;top:90%"><span class="disc" style="--p:0%"><span class="ball"><span class="face f-sleepy"><i class="e1"></i><i class="e2"></i><b></b></span></span></span><span class="nm">字母表</span><span class="st">0 / 1 套</span><span class="puretag">未完成</span></div>

    <div class="gate"><span class="ring">🚪</span><span class="lbl">能力测试</span></div>

    <div class="feat" style="left:86%;top:58%"><span class="fstar">🔍</span><span class="fnm">看图猜词</span><span class="fsoon">即将上线</span></div>
    <div class="feat" style="left:86%;top:82%"><span class="fstar">📖</span><span class="fnm">AI 绘本</span><span class="fsoon">即将上线</span></div>
  </div>
</div>
</body>
</html>
