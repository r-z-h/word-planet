<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  :root{
    --ink:#fff1d6; --muted:#c9b8f0; --dim:#9a8bc0;
    --gold:#ffd166; --panel:#2a1a4d; --line:rgba(255,226,168,.20);
    --l2a:#6ff0c4; --l2b:#12b886;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:radial-gradient(120% 90% at 30% 0%, #341c5a, #140b28 70%);
    font-family:"Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    color:var(--ink); padding:18px; display:flex; justify-content:center;
  }
  .wrap{width:540px}
  .page-hint{font-size:12px;color:var(--dim);margin:0 0 10px 2px}
  .card{
    background:var(--panel);
    border:2px solid var(--line);
    border-radius:16px;
    padding:13px 15px 15px;
    box-shadow:0 14px 34px rgba(0,0,0,.45);
  }
  .card h3{
    font-size:10px; letter-spacing:.16em; color:var(--muted);
    font-weight:800; margin:0 0 10px; display:flex; align-items:center; gap:6px;
  }
  .kp{display:flex;align-items:center;gap:11px}
  .dot{
    width:44px;height:44px;border-radius:50%;flex:none;position:relative;
    background:radial-gradient(circle at 32% 28%, #7cf3d0, var(--l2b) 72%);
    border:2.5px solid #17102b; box-shadow:0 3px 0 #17102b;
  }
  .dot i{position:absolute;background:#17102b;border-radius:50%}
  .dot .e1{left:10px;top:13px;width:6px;height:8px}
  .dot .e2{right:10px;top:13px;width:6px;height:8px}
  .dot b{position:absolute;left:50%;transform:translateX(-50%);top:25px;width:13px;height:8px;background:#17102b;border-radius:3px 3px 8px 8px}
  .nm{font-size:16px;font-weight:900}
  .sub{font-size:11px;color:var(--muted);margin-top:3px}
  .bar{height:8px;border-radius:99px;background:rgba(255,246,225,.12);margin-top:12px;overflow:hidden;border:2px solid rgba(255,232,180,.18)}
  .bar i{display:block;height:100%;width:10%;background:linear-gradient(90deg,#6ff0c4,#12b886)}
  .barlab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:6px;font-weight:700}
  .chain3{display:flex;align-items:center;gap:5px;margin-top:11px}
  .layer{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;
    background:rgba(255,246,225,.08);border:1.5px solid rgba(255,232,180,.24);
    font-size:12px;font-weight:900;white-space:nowrap}
  .layer em{font-style:normal;font-size:9.5px;color:var(--muted);font-weight:700}
  .layer.hot{background:rgba(255,205,76,.14);border-color:rgba(255,205,76,.5)}
  .ar{color:var(--dim);font-weight:900;font-size:11px}
  .btnrow{display:flex;gap:7px;margin-top:11px}
  .ebtn{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:8px 6px;border-radius:10px;
    font-size:11px;font-weight:900;color:#3a2109;
    background:linear-gradient(180deg,#ffd166,#f4a340);border:2px solid #17102b;box-shadow:0 3px 0 #17102b}
  .ebtn[disabled]{filter:grayscale(1) brightness(.72);box-shadow:none;color:#241a3a}

  /* ===== 新增：补兑换 ===== */
  .sup{margin-top:14px;border-top:1px dashed rgba(255,232,180,.22);padding-top:12px}
  .sup-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .sup-head .t{font-size:11px;font-weight:900;color:var(--gold);display:flex;align-items:center;gap:6px}
  .tag{font-size:9px;font-weight:900;color:#3a2109;background:linear-gradient(180deg,#ffd166,#f4a340);
    border-radius:99px;padding:2px 7px}
  .sup-head .cnt{font-size:10px;color:var(--muted);font-weight:800}
  .sup-row{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:11px;margin-bottom:6px;
    background:rgba(255,246,225,.06);border:1.5px solid rgba(255,232,180,.16)}
  .sup-row .sn{font-size:11.5px;font-weight:900;color:var(--ink);width:52px;flex:none}
  .sup-row .fl{font-size:10.5px;color:#ff9db4;font-weight:800;flex:1}
  .sup-row .fl b{color:var(--ink);font-size:11.5px}
  .mini{display:inline-flex;align-items:center;padding:6px 10px;border-radius:9px;font-size:10.5px;font-weight:900;color:#3a2109;
    background:linear-gradient(180deg,#ffd166,#f4a340);border:2px solid #17102b;box-shadow:0 2px 0 #17102b;white-space:nowrap}
  .done{font-size:10px;color:var(--l2a);font-weight:900}
  .note{font-size:10px;color:var(--muted);line-height:1.6;margin-top:8px}
  .note b{color:var(--gold)}
  .arrow-note{font-size:9.5px;color:var(--dim);margin:2px 0 0 2px}
</style>
</head>
<body>
  <div class="wrap">
    <p class="page-hint">预览（示意图，未改正式代码）· 首页「正在闯的星球」卡片</p>
    <div class="card">
      <h3>正在闯的星球</h3>

      <div class="kp">
        <span class="dot"><i class="e1"></i><i class="e2"></i><b></b></span>
        <div>
          <div class="nm">单词跟读</div>
          <div class="sub">L2 · 跟读题 · 第 4 / 29 套</div>
        </div>
      </div>

      <div class="bar"><i></i></div>
      <div class="barlab"><span>3 套已完成</span><span>29 套</span></div>

      <div class="chain3">
        <span class="layer">🌸 2<em>朵</em></span>
        <span class="ar">→</span>
        <span class="layer">⭐ 0<em>颗</em></span>
        <span class="ar">→</span>
        <span class="layer hot">🦩 0<em>个</em></span>
      </div>

      <div class="btnrow">
        <button class="ebtn" disabled>🌸3 → ⭐1</button>
        <button class="ebtn" disabled>⭐5 → 徽记</button>
      </div>

      <!-- 新增区块 -->
      <div class="sup">
        <div class="sup-head">
          <span class="t"><span class="tag">新增</span>可补兑换的已完成套</span>
          <span class="cnt">徽章 0 / 3</span>
        </div>

        <div class="sup-row">
          <span class="sn">第 1 套</span>
          <span class="fl">🌸 <b>15</b> 已满 → 可兑</span>
          <button class="mini">补兑 ⭐5 → 徽记</button>
        </div>
        <div class="sup-row">
          <span class="sn">第 2 套</span>
          <span class="fl">🌸 <b>15</b> 已满 → 可兑</span>
          <button class="mini">补兑 ⭐5 → 徽记</button>
        </div>
        <div class="sup-row">
          <span class="sn">第 3 套</span>
          <span class="fl">🌸 <b>15</b> 已满 → 可兑</span>
          <button class="mini">补兑 ⭐5 → 徽记</button>
        </div>

        <div class="note">
          补兑后集齐 <b>3 枚徽章</b> 即可解锁 L3 能力测试（当前 0/3）。<br/>
          已兑换的套会显示「✓ 已兑换 1 枚」，不再出现补兑按钮。
        </div>
        <p class="arrow-note">※ 花→星也一并支持：每行也可先「🌸3→⭐1」，凑满 5 星再兑徽章。</p>
      </div>
    </div>
  </div>
</body>
</html>
