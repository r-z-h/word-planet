<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#f4f6fb;font-family:"Microsoft YaHei",sans-serif;color:#2a2f3a}
.wrap{width:1600px;padding:26px 32px} h1{font-size:20px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.card{background:#fff;border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;box-shadow:0 6px 18px rgba(40,60,110,.07)}
.card img{width:150px;height:150px;object-fit:contain} .en{font-size:14px;font-weight:800;margin-top:4px}
</style></head><body><div class="wrap"><h1>看图猜词 · 动物类（17，专业 3D 插画）</h1><div class="grid" id="g"></div></div>
<script>
const order=["cat","dog","pig","bear","panda","tiger","monkey","cow","sheep","hen","duck","elephant","horse","giraffe","goat","fish","bird"];
document.getElementById('g').innerHTML=order.map(w=>`<div class="card"><img src="../../.run/fluent_animals/${w}.png"/><div class="en">${w}</div></div>`).join('');
</script></body></html>
