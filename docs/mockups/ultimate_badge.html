<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
body{margin:0;background:radial-gradient(120% 90% at 50% 0%,#241245,#0d0619 70%);font-family:"Microsoft YaHei",sans-serif;color:#fff1d6;display:flex;justify-content:center;gap:34px;padding:26px 16px 34px}
.item{text-align:center;width:300px}
.badge{width:280px;height:280px;margin:0 auto;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(255,214,120,.18),rgba(120,80,200,.06) 55%,transparent 72%);border-radius:50%}

.cap{margin-top:10px;font-size:16px;font-weight:900;color:#ffd166}
.sub{font-size:11.5px;color:#c9b8f0;margin-top:4px}
</style></head><body>
